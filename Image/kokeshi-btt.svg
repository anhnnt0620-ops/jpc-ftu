<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <!-- Gradients for Ban Thong Tin (Violet Amethyst & Creative Magenta) -->
    <radialGradient id="faceGradBTT" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="70%" stop-color="#faeed9" />
      <stop offset="100%" stop-color="#ebd8be" />
    </radialGradient>
    <linearGradient id="hairGradBTT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1d36" />
      <stop offset="60%" stop-color="#180e1e" />
      <stop offset="100%" stop-color="#0a050d" />
    </linearGradient>
    <linearGradient id="kimonoGradBTT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="magentaTrimBTT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="obiGradBTT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="kokeshiShadowBTT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#kokeshiShadowBTT)">
    <!-- Base Shadow -->
    <ellipse cx="80" cy="210" rx="36" ry="7" fill="#0d0612" opacity="0.4" />

    <!-- Wooden Torso / Kimono (Ban Thong Tin - Violet Amethyst) -->
    <path d="M 52 110 C 44 135, 42 175, 46 205 C 54 212, 106 212, 114 205 C 118 175, 116 135, 108 110 Z" 
          fill="url(#kimonoGradBTT)" stroke="url(#magentaTrimBTT)" stroke-width="1.8" />

    <!-- Kimono Lapels (Eri) -->
    <path d="M 62 108 L 80 142 L 72 142 Z" fill="#fff8f0" opacity="0.9" />
    <path d="M 98 108 L 78 144 L 84 144 Z" fill="url(#magentaTrimBTT)" />
    <path d="M 64 110 L 80 142 L 96 110" fill="none" stroke="url(#magentaTrimBTT)" stroke-width="2" />

    <!-- Kimono Pattern (Origami Crane & Media Shutter / Star Spark) -->
    <g transform="translate(80, 175)" opacity="0.95">
      <!-- Origami Crane (Orizuru) Motif -->
      <polygon points="0,-12 -12,2 0,7 12,2" fill="#fdf2f8" stroke="url(#magentaTrimBTT)" stroke-width="0.8" />
      <polygon points="0,-12 -18,-5 -12,2" fill="#f472b6" opacity="0.8" />
      <polygon points="0,-12 18,-5 12,2" fill="#f472b6" opacity="0.8" />
      <!-- Star Spark / Lens Shutter -->
      <circle cx="-16" cy="14" r="2.2" fill="#fbcfe8" />
      <circle cx="16" cy="14" r="2.2" fill="#fbcfe8" />
      <path d="M -18 -8 Q -16 -4 -13 -6" stroke="#fb7185" stroke-width="1" fill="none" />
      <path d="M 18 -8 Q 16 -4 13 -6" stroke="#fb7185" stroke-width="1" fill="none" />
    </g>

    <!-- Obi Sash (Rose Magenta) -->
    <rect x="50" y="140" width="60" height="15" rx="3" fill="url(#obiGradBTT)" stroke="url(#magentaTrimBTT)" stroke-width="1" />
    <!-- Obi-jime Cord -->
    <line x1="50" y1="147.5" x2="110" y2="147.5" stroke="#fff8f0" stroke-width="1.5" />
    <circle cx="80" cy="147.5" r="3" fill="#c084fc" stroke="#fdf2f8" stroke-width="1" />

    <!-- Wooden Head (Spherical Kokeshi) -->
    <circle cx="80" cy="68" r="36" fill="url(#faceGradBTT)" stroke="url(#magentaTrimBTT)" stroke-width="1.2" />

    <!-- Creative Modern Hairstyle (Twin Ribbon Buns) -->
    <path d="M 45 68 C 45 35, 60 22, 80 22 C 100 22, 115 35, 115 68 C 115 76, 113 88, 110 94 C 106 82, 104 60, 104 55 C 96 50, 64 50, 56 55 C 56 60, 54 82, 50 94 C 47 88, 45 76, 45 68 Z" 
          fill="url(#hairGradBTT)" />
    <!-- Twin Buns (Odango) -->
    <circle cx="56" cy="30" r="11" fill="url(#hairGradBTT)" />
    <circle cx="104" cy="30" r="11" fill="url(#hairGradBTT)" />
    <!-- Bangs -->
    <path d="M 56 55 Q 80 64 104 55 Q 80 44 56 55 Z" fill="url(#hairGradBTT)" />

    <!-- Ribbon & Origami Hairpins -->
    <g transform="translate(104, 30)">
      <polygon points="0,0 8,-6 10,2" fill="#ec4899" />
      <circle cx="0" cy="0" r="3" fill="#fdf2f8" />
    </g>
    <g transform="translate(56, 30)">
      <polygon points="0,0 -8,-6 -10,2" fill="#ec4899" />
      <circle cx="0" cy="0" r="3" fill="#fdf2f8" />
    </g>

    <!-- Eyes (Spirited, Creative) -->
    <path d="M 64 68 Q 70 64 74 68" fill="none" stroke="#221226" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 86 68 Q 90 64 96 68" fill="none" stroke="#221226" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 75 67 L 76.5 65" stroke="#221226" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 85 67 L 83.5 65" stroke="#221226" stroke-width="1.2" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="63" cy="76" rx="5.5" ry="3" fill="#f43f5e" opacity="0.38" />
    <ellipse cx="97" cy="76" rx="5.5" ry="3" fill="#f43f5e" opacity="0.38" />

    <!-- Cheerful Smile -->
    <path d="M 76 81 Q 80 84.5 84 81" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" />
    <!-- Eyebrows -->
    <path d="M 66 61 Q 70 58.5 74 61" fill="none" stroke="#3b2342" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 86 61 Q 90 58.5 94 61" fill="none" stroke="#3b2342" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
