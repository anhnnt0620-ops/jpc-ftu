<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <!-- Gradients for Ban To Chuc (Crimson & Imperial Gold) -->
    <radialGradient id="faceGradBTC" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="70%" stop-color="#faeed9" />
      <stop offset="100%" stop-color="#ebd8be" />
    </radialGradient>
    <linearGradient id="hairGradBTC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2226" />
      <stop offset="60%" stop-color="#191316" />
      <stop offset="100%" stop-color="#0a0708" />
    </linearGradient>
    <linearGradient id="kimonoGradBTC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="45%" stop-color="#881318" />
      <stop offset="100%" stop-color="#4c080b" />
    </linearGradient>
    <linearGradient id="goldTrimBTC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="obiGradBTC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="kokeshiShadowBTC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#kokeshiShadowBTC)">
    <!-- Base Shadow -->
    <ellipse cx="80" cy="210" rx="36" ry="7" fill="#0c0708" opacity="0.4" />

    <!-- Wooden Torso / Kimono (Ban To Chuc - Crimson Red) -->
    <path d="M 52 110 C 44 135, 42 175, 46 205 C 54 212, 106 212, 114 205 C 118 175, 116 135, 108 110 Z" 
          fill="url(#kimonoGradBTC)" stroke="url(#goldTrimBTC)" stroke-width="1.8" />

    <!-- Kimono Lapels (Eri) -->
    <path d="M 62 108 L 80 142 L 72 142 Z" fill="#fff8f0" opacity="0.9" />
    <path d="M 98 108 L 78 144 L 84 144 Z" fill="url(#goldTrimBTC)" />
    <path d="M 64 110 L 80 142 L 96 110" fill="none" stroke="url(#goldTrimBTC)" stroke-width="2" />

    <!-- Kimono Floral / Crest Pattern (Kikyo / Organizer Fan Motif) -->
    <g transform="translate(80, 175)" opacity="0.85">
      <!-- Golden Sensu (Folding Fan) Emblem -->
      <path d="M -16 5 Q 0 -12 16 5 Q 0 8 -16 5 Z" fill="url(#goldTrimBTC)" />
      <path d="M 0 6 L -14 5 M 0 6 L -7 -5 M 0 6 L 0 -11 M 0 6 L 7 -5 M 0 6 L 14 5" stroke="#78350f" stroke-width="0.8" />
      <!-- Sakura petals -->
      <circle cx="-16" cy="-14" r="3.2" fill="#fecdd3" />
      <circle cx="17" cy="-12" r="2.8" fill="#fecdd3" />
      <circle cx="15" cy="16" r="2.4" fill="#fecdd3" />
      <circle cx="-13" cy="18" r="2.4" fill="#fecdd3" />
    </g>

    <!-- Obi Sash (Gold Brocade) -->
    <rect x="50" y="140" width="60" height="15" rx="3" fill="url(#obiGradBTC)" stroke="url(#goldTrimBTC)" stroke-width="1" />
    <!-- Obi-jime Cord -->
    <line x1="50" y1="147.5" x2="110" y2="147.5" stroke="#fff8f0" stroke-width="1.5" />
    <circle cx="80" cy="147.5" r="3" fill="#b91c1c" stroke="#fef08a" stroke-width="1" />

    <!-- Wooden Head (Spherical Kokeshi) -->
    <circle cx="80" cy="68" r="36" fill="url(#faceGradBTC)" stroke="url(#goldTrimBTC)" stroke-width="1.2" />

    <!-- Traditional Hair (Japanese Bob / Hime Cut) -->
    <path d="M 45 68 C 45 35, 60 22, 80 22 C 100 22, 115 35, 115 68 C 115 76, 113 88, 110 94 C 106 82, 104 60, 104 55 C 96 50, 64 50, 56 55 C 56 60, 54 82, 50 94 C 47 88, 45 76, 45 68 Z" 
          fill="url(#hairGradBTC)" />
    <!-- Bangs (Maegami) -->
    <path d="M 56 55 Q 80 62 104 55 Q 80 44 56 55 Z" fill="url(#hairGradBTC)" />

    <!-- Kanzashi Hairpin (Gold & Red Tassel) -->
    <g transform="translate(108, 42)">
      <circle cx="0" cy="0" r="5.5" fill="url(#goldTrimBTC)" />
      <circle cx="0" cy="0" r="2.5" fill="#dc2626" />
      <!-- Dangling cords -->
      <path d="M -1 5 Q 3 14 0 20" stroke="#dc2626" stroke-width="1.6" fill="none" />
      <circle cx="0" cy="20" r="1.8" fill="#fbbf24" />
    </g>

    <!-- Eyes (Delicate Serene Brushstrokes) -->
    <path d="M 64 68 Q 70 65 74 69" fill="none" stroke="#261b1f" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 86 69 Q 90 65 96 68" fill="none" stroke="#261b1f" stroke-width="2.2" stroke-linecap="round" />
    <!-- Eyelashes accent -->
    <path d="M 74 68 L 76 66" stroke="#261b1f" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 86 68 L 84 66" stroke="#261b1f" stroke-width="1.2" stroke-linecap="round" />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="63" cy="76" rx="5.5" ry="3" fill="#f43f5e" opacity="0.35" />
    <ellipse cx="97" cy="76" rx="5.5" ry="3" fill="#f43f5e" opacity="0.35" />

    <!-- Gentle Smile -->
    <path d="M 77 81 Q 80 84 83 81" fill="none" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round" />
    <!-- Eyebrows -->
    <path d="M 66 61 Q 70 59 74 62" fill="none" stroke="#443338" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 86 62 Q 90 59 94 61" fill="none" stroke="#443338" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
